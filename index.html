<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Techno Defense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="bg-layer" width="1000" height="600"></canvas>
            <canvas id="dynamic-layer" width="1000" height="600"></canvas>
            <canvas id="ui-layer" width="1000" height="600"></canvas>
            
            <div id="start-menu" class="overlay-menu">
                <div class="menu-content">
                    <h1 class="game-title">TECHNO<br><span style="color:#00ffcc">DEFENSE</span></h1>
                    <button id="btn-play" class="menu-btn">ИГРАТЬ</button>
                    <button id="btn-exit" class="menu-btn exit">ВЫХОД</button>
                </div>
            </div>

            <div id="main-menu" class="overlay-menu hidden">
                <div class="menu-content">
                    <h1>ВЫБЕРИТЕ УРОВЕНЬ</h1>
                    <div id="levels-grid"></div>
                    <button id="btn-back-to-start" class="menu-btn small">НАЗАД</button>
                </div>
            </div>

            <div id="pause-menu" class="overlay-menu hidden">
                <div class="menu-content">
                    <h1>ПАУЗА</h1>
                    <button id="btn-resume" class="menu-btn">ПРОДОЛЖИТЬ</button>
                    <button id="btn-restart" class="menu-btn">РЕСТАРТ</button>
                    <button id="btn-quit" class="menu-btn exit">В МЕНЮ</button>
                </div>
            </div>

            <div id="unlock-modal" class="overlay-menu hidden">
                <div class="menu-content">
                    <h2 style="color: #00ffcc;">НОВАЯ БАШНЯ!</h2>
                    <div id="unlock-icon" style="width:60px; height:60px; border-radius:50%; border:2px solid #fff; margin:20px auto;"></div>
                    <h3 id="unlock-name">---</h3>
                    <p id="unlock-desc" style="margin:15px; font-size:14px; opacity:0.8;"></p>
                    <button id="btn-unlock-ok" class="menu-btn">OK</button>
                </div>
            </div>

            <button id="btn-pause" class="hidden">⏸</button>
            <button id="btn-speed" class="hidden">x1</button>
        </div>
        <div id="ui-panel"></div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
