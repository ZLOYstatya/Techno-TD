<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECHNO DEFENSE</title>
    <style>
        /* ВСТАВЛЯЕМ СТИЛИ ПРЯМО СЮДА, ЧТОБЫ ОНИ ТОЧНО ЗАРАБОТАЛИ */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #050508; color: #00ffff; font-family: sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; }
        #bg-layer { z-index: 1; background: #0d0e14; }
        #dynamic-layer { z-index: 2; }
        #ui-layer { z-index: 3; }

        #start-menu, #main-menu, #pause-menu {
            position: absolute; inset: 0; background: rgba(10, 11, 16, 0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px; text-align: center;
        }

        .hidden { display: none !important; }

        #levels-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
            width: 95%; max-width: 500px; max-height: 60vh; overflow-y: auto;
            padding: 15px; margin: 20px 0; background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; border: 1px solid #1f2233; touch-action: pan-y; 
        }

        .level-btn {
            aspect-ratio: 1/1; background: #1a1c26; border: 2px solid #2d3142;
            color: #fff; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .level-btn:active { background: #00ffff; color: #000; transform: scale(0.95); }

        #ui-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 90px;
            background: rgba(15, 17, 26, 0.95); border-top: 2px solid #00ffff;
            display: flex; align-items: center; padding: 0 10px; overflow-x: auto;
            touch-action: pan-x; gap: 12px; z-index: 10;
        }

        .tower-btn {
            min-width: 70px; height: 70px; background: #232736; border: 1px solid #3d445c;
            border-radius: 10px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 0.65rem; color: #fff; flex-shrink: 0;
        }
        .tower-btn.selected { border: 2px solid #00ffff; background: #1a3a4a; }
        .tower-icon { width: 26px; height: 26px; margin-bottom: 4px; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="bg-layer"></canvas>
        <canvas id="dynamic-layer"></canvas>
        <canvas id="ui-layer"></canvas>

        <div id="start-menu">
            <h1 style="color: #00ffff; margin-bottom: 30px; text-shadow: 0 0 15px #00ffff;">TECHNO DEFENSE</h1>
            <button id="btn-play" class="level-btn" style="width: 200px; height: 60px;">ИГРАТЬ</button>
            <button id="btn-exit" class="level-btn" style="width: 200px; height: 60px; margin-top: 15px; opacity: 0.5;">ВЫХОД</button>
        </div>

        <div id="main-menu" class="hidden">
            <h2>ВЫБОР СЕКТОРА</h2>
            <div id="levels-grid"></div>
            <button id="btn-back-to-start" class="level-btn" style="width: 150px; height: 50px;">НАЗАД</button>
        </div>

        <div id="ui-overlay" style="position: absolute; top: 10px; left: 10px; z-index: 100; pointer-events: none;">
            <div id="btn-pause" style="pointer-events: auto; display: inline-block; margin-right: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; border: 1px solid #0ff;">⏸ ПАУЗА</div>
            <div id="btn-speed" style="pointer-events: auto; display: inline-block; background: rgba(0,0,0,0.5); padding: 5px 10px; border: 1px solid #0ff;">x1</div>
        </div>

        <div id="ui-panel"></div>

        <div id="pause-menu" class="hidden">
            <h2>ПАУЗА</h2>
            <button id="btn-resume" class="level-btn" style="width: 200px; height: 60px; margin-bottom: 10px;">ПРОДОЛЖИТЬ</button>
            <button id="btn-restart" class="level-btn" style="width: 200px; height: 60px;">ЗАНОВО</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
